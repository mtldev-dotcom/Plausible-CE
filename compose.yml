services:
  plausible_db:
    image: postgres:16-alpine
    restart: always
    volumes:
      - db-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=plausible_db
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d plausible_db"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - dokploy-network

  plausible_events_db:
    image: clickhouse/clickhouse-server:24.12-alpine
    restart: always
    volumes:
      - event-data:/var/lib/clickhouse
      - event-logs:/var/log/clickhouse-server
      - ./clickhouse/logs.xml:/etc/clickhouse-server/config.d/logs.xml:ro
      - ./clickhouse/ipv4-only.xml:/etc/clickhouse-server/config.d/ipv4-only.xml:ro
      - ./clickhouse/low-resources.xml:/etc/clickhouse-server/config.d/low-resources.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    environment:
      - CLICKHOUSE_SKIP_USER_SETUP=1
    healthcheck:
      test: ["CMD-SHELL","wget --no-verbose --tries=1 -O - http://127.0.0.1:8123/ping | grep -q 'Ok'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s
    networks:
      - dokploy-network

  plausible:
    image: ghcr.io/plausible/community-edition:v3.0.1
    restart: always
    command: sh -c "/entrypoint.sh db createdb && /entrypoint.sh db migrate && /entrypoint.sh run"
    depends_on:
      plausible_db:
        condition: service_healthy
      plausible_events_db:
        condition: service_healthy
    volumes:
      - plausible-data:/var/lib/plausible
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    environment:
      - TMPDIR=/var/lib/plausible/tmp
      - BASE_URL=${BASE_URL}
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      # Explicit DB URLs so there’s no ambiguity:
      - DATABASE_URL=postgres://postgres:postgres@plausible_db:5432/plausible_db
      - CLICKHOUSE_DATABASE_URL=http://plausible_events_db:8123/plausible_events_db

      # (Keep the rest for Dokploy to inject if you use them)
      - TOTP_VAULT_KEY
      - DISABLE_REGISTRATION
      - ENABLE_EMAIL_VERIFICATION
      - HTTP_PORT
      - HTTPS_PORT
      - GOOGLE_CLIENT_ID
      - GOOGLE_CLIENT_SECRET
      - IP_GEOLOCATION_DB
      - GEONAMES_SOURCE_FILE
      - MAXMIND_LICENSE_KEY
      - MAXMIND_EDITION
      - MAILER_ADAPTER
      - MAILER_EMAIL
      - MAILER_NAME
      - SMTP_HOST_ADDR
      - SMTP_HOST_PORT
      - SMTP_USER_NAME
      - SMTP_USER_PWD
      - SMTP_HOST_SSL_ENABLED
      - POSTMARK_API_KEY
      - MAILGUN_API_KEY
      - MAILGUN_DOMAIN
      - MAILGUN_BASE_URI
      - MANDRILL_API_KEY
      - SENDGRID_API_KEY
    labels:
      - traefik.docker.network=dokploy-network
      - traefik.http.routers.nicky-bruno-portfolio-plausible-wel2aw-51-web.rule=Host(`plausible.nickybruno.com`)
      - traefik.http.routers.nicky-bruno-portfolio-plausible-wel2aw-51-web.entrypoints=web
      - traefik.http.services.nicky-bruno-portfolio-plausible-wel2aw-51-web.loadbalancer.server.port=8000
      - traefik.http.routers.nicky-bruno-portfolio-plausible-wel2aw-51-web.service=nicky-bruno-portfolio-plausible-wel2aw-51-web
      - traefik.http.routers.nicky-bruno-portfolio-plausible-wel2aw-51-web.middlewares=redirect-to-https@file
      - traefik.http.routers.nicky-bruno-portfolio-plausible-wel2aw-51-websecure.rule=Host(`plausible.nickybruno.com`)
      - traefik.http.routers.nicky-bruno-portfolio-plausible-wel2aw-51-websecure.entrypoints=websecure
      - traefik.http.services.nicky-bruno-portfolio-plausible-wel2aw-51-websecure.loadbalancer.server.port=8000
      - traefik.http.routers.nicky-bruno-portfolio-plausible-wel2aw-51-websecure.service=nicky-bruno-portfolio-plausible-wel2aw-51-websecure
      - traefik.http.routers.nicky-bruno-portfolio-plausible-wel2aw-51-websecure.tls.certresolver=letsencrypt
      - traefik.enable=true
    networks:
      - dokploy-network

volumes:
  db-data: {}
  event-data: {}
  event-logs: {}
  plausible-data: {}

networks:
  dokploy-network:
    external: true
